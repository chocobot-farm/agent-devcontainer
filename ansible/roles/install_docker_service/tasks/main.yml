---
- name: Restart Docker service to apply config changes
  ansible.builtin.systemd_service:
    name: docker.service
    # install_docker registers install_docker_docker_daemon_config. Tolerate it
    # being undefined so this role can also run standalone against a host that
    # already has Docker installed.
    state: >-
      {{
        'restarted'
        if (install_docker_docker_daemon_config is defined
            and install_docker_docker_daemon_config.changed | default(false))
        else 'started'
      }}
    enabled: true
    daemon_reload: true

- name: Ensure containerd service is running
  ansible.builtin.systemd_service:
    name: containerd.service
    state: started
    enabled: true
