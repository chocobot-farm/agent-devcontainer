---
# Seed the agent catalog into the image.
#
# Claude Code reads CLAUDE_CODE_PLUGIN_SEED_DIR at session start, registers the
# marketplaces it finds there, and uses the seeded plugin cache in place. It
# re-derives each marketplace's install location from the seed directory at
# runtime, so the tree survives being mounted somewhere other than where it was
# built. Codex has no equivalent, so its half is a plain skills directory.
- name: Check whether Claude Code is installed
  ansible.builtin.stat:
    path: "{{ agentic_tools_claude_bin }}"
  register: agentic_tools_seed_claude_bin

- name: Report that catalog seeding needs Claude Code
  ansible.builtin.debug:
    msg: >-
      Claude Code is not installed at {{ agentic_tools_claude_bin }}; skipping the
      catalog seed. Set agentic_tools_claude_bin if it lives elsewhere.
  when: not agentic_tools_seed_claude_bin.stat.exists

- name: Seed the agent catalog
  when: agentic_tools_seed_claude_bin.stat.exists
  vars:
    agentic_tools_seed_marketplace_dir: >-
      {{ agentic_tools_plugin_seed_dir }}/marketplaces/{{ agentic_tools_seed_marketplace_name }}
  block:
    - name: Read the catalog marketplace manifest
      ansible.builtin.slurp:
        src: "{{ agentic_tools_seed_source_dir }}/{{ agentic_tools_seed_marketplace_manifest }}"
      register: agentic_tools_seed_manifest_raw

    - name: Resolve the marketplace name and the plugin entry it publishes
      ansible.builtin.set_fact:
        agentic_tools_seed_marketplace_name: "{{ agentic_tools_seed_manifest.name }}"
        agentic_tools_seed_plugin_entries: >-
          {{ agentic_tools_seed_manifest.plugins
             | selectattr('name', 'equalto', agentic_tools_plugin_name)
             | list }}
      vars:
        agentic_tools_seed_manifest: >-
          {{ agentic_tools_seed_manifest_raw.content | b64decode | from_json }}

    - name: Fail when the manifest does not publish exactly one matching plugin
      ansible.builtin.assert:
        that:
          - agentic_tools_seed_plugin_entries | length == 1
        fail_msg: >-
          {{ agentic_tools_seed_marketplace_manifest }} publishes
          {{ agentic_tools_seed_plugin_entries | length }} plugins named
          '{{ agentic_tools_plugin_name }}'; expected exactly one.

    - name: Record the seeded plugin version and source path
      ansible.builtin.set_fact:
        agentic_tools_seed_plugin_version: "{{ agentic_tools_seed_plugin_entry.version }}"
        agentic_tools_seed_plugin_source: >-
          {{ agentic_tools_seed_plugin_entry.source | regex_replace('^\./', '') | regex_replace('/$', '') }}
      vars:
        agentic_tools_seed_plugin_entry: "{{ agentic_tools_seed_plugin_entries | first }}"

    - name: Fail when the pinned plugin version is not the one being seeded
      ansible.builtin.assert:
        that:
          - agentic_tools_seed_plugin_version == agentic_tools_plugin_version
        fail_msg: >-
          Pinned version '{{ agentic_tools_plugin_version }}' does not match version
          '{{ agentic_tools_seed_plugin_version }}' declared by
          {{ agentic_tools_seed_marketplace_manifest }}. Bump the pin and the
          manifest together so the image label stays honest.
      when: agentic_tools_plugin_version | length > 0

    - name: Reset the seeded marketplace tree
      ansible.builtin.file:
        path: "{{ agentic_tools_seed_marketplace_dir }}"
        state: absent

    - name: Create the seeded marketplace directories
      ansible.builtin.file:
        path: "{{ agentic_tools_seed_marketplace_dir }}/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ agentic_tools_seed_marketplace_manifest | dirname }}"
        - "{{ agentic_tools_seed_plugin_source }}"

    # The marketplace manifest resolves its plugin by a path relative to its own
    # root, so the two trees have to keep their relative layout in the seed.
    - name: Copy the catalog into the seeded marketplace tree
      ansible.builtin.command:
        argv:
          - cp
          - --archive
          - "{{ agentic_tools_seed_source_dir }}/{{ item }}/."
          - "{{ agentic_tools_seed_marketplace_dir }}/{{ item }}/"
      loop:
        - "{{ agentic_tools_seed_marketplace_manifest | dirname }}"
        - "{{ agentic_tools_seed_plugin_source }}"
      changed_when: true

    - name: Find build scratch directories copied into the seed
      ansible.builtin.find:
        paths: "{{ agentic_tools_seed_marketplace_dir }}"
        patterns: "{{ agentic_tools_seed_prune_names }}"
        file_type: directory
        recurse: true
        hidden: true
      register: agentic_tools_seed_scratch_dirs

    - name: Remove build scratch directories from the seed
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ agentic_tools_seed_scratch_dirs.files }}"
      loop_control:
        label: "{{ item.path }}"

    # CLAUDE_CODE_PLUGIN_CACHE_DIR makes the CLI write its marketplace registry and
    # plugin cache straight into the seed. The scratch config directory keeps the
    # session state the CLI writes alongside them out of the image.
    - name: Create a scratch Claude configuration directory for the build
      ansible.builtin.tempfile:
        state: directory
        suffix: claude-seed
      register: agentic_tools_seed_build_config

    - name: Populate the seed with the marketplace and the plugin
      ansible.builtin.command:
        argv: "{{ item }}"
      environment:
        CLAUDE_CONFIG_DIR: "{{ agentic_tools_seed_build_config.path }}"
        CLAUDE_CODE_PLUGIN_CACHE_DIR: "{{ agentic_tools_plugin_seed_dir }}"
      loop:
        - - "{{ agentic_tools_claude_bin }}"
          - plugin
          - marketplace
          - add
          - "{{ agentic_tools_seed_marketplace_dir }}"
        - - "{{ agentic_tools_claude_bin }}"
          - plugin
          - install
          - "{{ agentic_tools_plugin_name }}@{{ agentic_tools_seed_marketplace_name }}"
      loop_control:
        label: "{{ item[1:] | join(' ') }}"
      changed_when: true

    - name: Remove the scratch Claude configuration directory
      ansible.builtin.file:
        path: "{{ agentic_tools_seed_build_config.path }}"
        state: absent

    # installed_plugins.json records absolute paths from the build. Claude Code
    # reads it from its own configuration directory, never from the seed, so a
    # stale copy here would only mislead whoever inspects the image.
    - name: Remove build-time installation state from the seed
      ansible.builtin.file:
        path: "{{ agentic_tools_plugin_seed_dir }}/installed_plugins.json"
        state: absent

    - name: Confirm the plugin landed in the seed cache
      ansible.builtin.stat:
        path: >-
          {{ agentic_tools_plugin_seed_dir }}/cache/{{ agentic_tools_seed_marketplace_name }}/{{
             agentic_tools_plugin_name }}/{{ agentic_tools_seed_plugin_version }}
      register: agentic_tools_seed_cache

    - name: Fail when the seed cache is missing the plugin
      ansible.builtin.assert:
        that:
          - agentic_tools_seed_cache.stat.isdir | default(false)
        fail_msg: >-
          Expected {{ agentic_tools_plugin_name }} {{ agentic_tools_seed_plugin_version }}
          under {{ agentic_tools_plugin_seed_dir }}/cache after installing it.

    - name: Copy the Codex half of the catalog out of the seeded plugin
      when: agentic_tools_seed_codex_skills | bool
      block:
        - name: Reset the seeded Codex skills directory
          ansible.builtin.file:
            path: "{{ agentic_tools_codex_skills_seed_dir }}"
            state: absent

        - name: Create the seeded Codex skills directory
          ansible.builtin.file:
            path: "{{ agentic_tools_codex_skills_seed_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0755"

        # Sourced from the seeded plugin rather than from the provisioning tree, so
        # the Claude and Codex halves of the catalog cannot drift apart.
        - name: Copy the seeded plugin skills into the Codex skills directory
          ansible.builtin.command:
            argv:
              - cp
              - --archive
              - "{{ agentic_tools_seed_marketplace_dir }}/{{ agentic_tools_seed_plugin_source }}/skills/."
              - "{{ agentic_tools_codex_skills_seed_dir }}/"
          changed_when: true

        - name: Ensure the Codex home directory exists
          ansible.builtin.file:
            path: "{{ agentic_tools_seed_codex_skills_link | dirname }}"
            state: directory
            owner: "{{ dev_user }}"
            mode: "0755"

        # A container that mounts a volume over the Codex home shadows this link;
        # re-creating it after the mount is the consuming project's job.
        - name: Point the Codex skills directory at the seed
          ansible.builtin.file:
            path: "{{ agentic_tools_seed_codex_skills_link }}"
            src: "{{ agentic_tools_codex_skills_seed_dir }}"
            state: link
            owner: "{{ dev_user }}"
            follow: false

    # The seed is read-only by design: Claude Code never writes to it and disables
    # auto-update for the marketplaces it finds there. Updating the catalog means
    # rebuilding the image.
    - name: Make the seed root-owned and read-only
      ansible.builtin.file:
        path: "{{ agentic_tools_seed_root }}"
        state: directory
        owner: root
        group: root
        mode: "{{ agentic_tools_seed_mode }}"
        recurse: true

    - name: Enable the seeded plugin for every session in the container
      when: agentic_tools_seed_enable_plugin | bool
      block:
        - name: Ensure the Claude configuration directory exists
          ansible.builtin.file:
            path: "{{ agentic_tools_seed_claude_settings_path | dirname }}"
            state: directory
            owner: "{{ dev_user }}"
            mode: "0755"

        - name: Stat existing Claude settings
          ansible.builtin.stat:
            path: "{{ agentic_tools_seed_claude_settings_path }}"
          register: agentic_tools_seed_settings_stat

        - name: Read existing Claude settings
          ansible.builtin.slurp:
            src: "{{ agentic_tools_seed_claude_settings_path }}"
          register: agentic_tools_seed_existing_settings
          when: agentic_tools_seed_settings_stat.stat.exists

        # Only enabledPlugins is written. The marketplace itself is left to the
        # seed, which resolves it to wherever the seed directory actually is.
        - name: Declare the seeded plugin in Claude settings
          ansible.builtin.copy:
            content: >-
              {{
                (agentic_tools_seed_existing_settings.content | b64decode | trim | default('{}', true) | from_json
                 if agentic_tools_seed_existing_settings.content is defined
                 else {})
                | combine({'enabledPlugins': {agentic_tools_seed_plugin_id: true}}, recursive=true)
                | to_nice_json
              }}
            dest: "{{ agentic_tools_seed_claude_settings_path }}"
            owner: "{{ dev_user }}"
            mode: "0644"
          vars:
            agentic_tools_seed_plugin_id: >-
              {{ agentic_tools_plugin_name }}@{{ agentic_tools_seed_marketplace_name }}
