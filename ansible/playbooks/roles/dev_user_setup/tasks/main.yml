---
# Development user setup tasks

- name: Create development user group
  ansible.builtin.group:
    name: "{{ dev_user_setup_username }}"
    gid: "{{ dev_user_setup_gid }}"
    state: present

- name: Create development user
  ansible.builtin.user:
    name: "{{ dev_user_setup_username }}"
    uid: "{{ dev_user_setup_uid }}"
    group: "{{ dev_user_setup_username }}"
    shell: /bin/bash
    create_home: true
    state: present

- name: Add development user to sudoers with NOPASSWD
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    line: "{{ dev_user_setup_username }} ALL=(ALL) NOPASSWD:ALL"
    state: present
    validate: "visudo -cf %s"

- name: Create workspace directory
  ansible.builtin.file:
    path: "{{ dev_user_setup_workspace_dir }}"
    state: directory
    owner: "{{ dev_user_setup_uid }}"
    group: "{{ dev_user_setup_gid }}"
    mode: "0755"

# Every role that runs after this one writes into user_home or becomes dev_user,
# so re-point those facts at the user just created.
- name: Swap user variables to {{ dev_user_setup_username }}
  ansible.builtin.set_fact:
    user_home: "/home/{{ dev_user_setup_username }}"
    dev_user: "{{ dev_user_setup_username }}" # noqa: var-naming[no-role-prefix]
