[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "validate_agent_files"
version = "0.0.0"
description = "CLI tools for validating agents and their skills."
readme = "README.md"
license = "MIT"
license-files = [
  "LICENSE",
]
# skills-ref, the primary skill validator, requires 3.11.
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "skills-ref>=0.1.1,<0.2"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
validate_agent_files = "validate_agent_files.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["validate_agent_files*"]
exclude = ["tests*"]

# The package is releasable on its own, so its test suite must be runnable from
# this directory without the repository that develops it. Configuring pytest here
# rather than inheriting a parent's configuration is what makes that true.
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: marks tests that exercise long-running or integration-heavy behavior",
  "integration: marks tests that exercise integrated behavior",
]
