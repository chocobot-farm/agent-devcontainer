[project]
name = "agent-devcontainer"
version = "0.0.0"
requires-python = ">=3.12"
description = "General-purpose agent development container: image build, devcontainer template, and agent catalog."

[dependency-groups]
dev = [
  "pre-commit>=4.2.0",
  "ansible>=11.4",
  "ansible-lint>=25.2.1",
  "pytest>=7.0.0",
  "pytest-cov>=7.0.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.11.5",
  "toml>=0.10.2",
  "pydantic>=2.0",
  "python-frontmatter>=1.1.0",
  "validate_agent_files",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.sources]
validate_agent_files = { path = "py_packages/validate_agent_files", editable = true }

[tool.pytest.ini_options]
# Two independent suites: the standalone packages under py_packages/, and the
# tests the agentdev plugin ships for its own scripts. Naming both keeps a bare
# `uv run pytest` covering everything.
testpaths = [
  "py_packages",
  ".agents/plugins/agentdev/tests",
]
markers = [
  "slow: marks tests that exercise long-running or integration-heavy behavior",
  "integration: marks tests that exercise integrated behavior",
]
